[package]
name = "bo2-rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Preserving diagnostic geometry adapters using Bevy mesh ownership"

[features]
default = []
client = ["bevy/bevy_pbr"]

[dependencies]
bo2-core = { path = "../core" }
bo2-assets = { path = "../assets" }
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh", "bevy_image", "dds", "bevy_pbr"] }

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }
