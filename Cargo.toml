[package]
name = "origins"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
default-run = "origins"

[workspace]
members = ["."]
exclude = ["vendor/bevy_render", "vendor/bevy_pbr", "vendor/bevy_solari"]
resolver = "3"

# Focused, source-pinned engine patches preserve Bevy ownership while exposing
# complete development-frame attribution and retained ray-scene integration.
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_solari = { path = "vendor/bevy_solari" }

[features]
default = []
ddgi = []
dev-dynamic = ["bevy/dynamic_linking"]
profile-tracy = ["bevy/trace_tracy", "bevy/debug", "dep:tracy-client"]
profile-tracy-memory = ["profile-tracy", "bevy/trace_tracy_memory"]
profile-chrome = ["bevy/trace_chrome", "bevy/debug"]

[dependencies]
# Native Solari schedule integration needs system names in ordinary releases.
# These names are functional schedule keys, not runtime tracing. Profiling is
# development-only; release strips log/tracing calls and disables LogPlugin.
bevy = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "debug", "async_executor", "multi_threaded", "bevy_asset", "bevy_scene", "bevy_gltf", "bevy_animation", "bevy_curve", "gltf_animation", "bevy_audio", "vorbis", "jpeg", "dds", "bevy_pbr", "bevy_solari", "pbr_multi_layer_material_textures", "experimental_pbr_pcss", "bevy_post_process", "bevy_anti_alias", "smaa_luts", "bevy_winit", "bevy_state", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "ui_picking", "bevy_text", "default_font", "keyboard", "mouse", "png", "tonemapping_luts", "bevy_log", "bevy_mikktspace", "reflect_auto_register", "zstd_rust"] }
# Upstream Avian's Bevy 0.20 migration, pinned rather than following a branch.
avian3d = { git = "https://github.com/andriyDev/avian.git", rev = "34c9b008d2f40638a953d9218db48d54f661365d", default-features = false, features = ["3d", "parry-f32", "collider-from-mesh", "enhanced-determinism"] }
# Serialize Bevy's physical key/button types for local control bindings.
bevy_input = { version = "=0.20.0-rc.2", features = ["serialize"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Development retains diagnostics; release compiles out all logs/events/spans.
log = { version = "=0.4.34", features = ["max_level_debug", "release_max_level_off"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std", "release_max_level_off"] }
# Restrict the native profiler to loopback even when launched outside our driver.
# Feature unification configures Bevy's existing Tracy client; shipping builds
# retain no listener and profiling needs no Windows Firewall access prompt.
tracy-client = { version = "=0.19.0", default-features = false, features = ["only-localhost"], optional = true }

[profile.dev]
opt-level = 1
lto = "off"
codegen-units = 16
debug = true
debug-assertions = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
panic = "abort"
