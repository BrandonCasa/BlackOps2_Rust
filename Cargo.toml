[workspace]
members = ["crates/core", "crates/assets", "game/boot", "tools/asset_inspector", "tools/map_inspector"]
default-members = ["game/boot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std"] }
