[package]
name = "origins"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
default-run = "origins"

[workspace]
members = ["."]
resolver = "3"

[features]
profile-tracy = ["bevy/trace_tracy", "bevy/debug"]
profile-chrome = ["bevy/trace_chrome", "bevy/debug"]

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_scene", "bevy_gltf", "bevy_animation", "bevy_audio", "vorbis", "jpeg", "bevy_pbr", "bevy_post_process", "bevy_anti_alias", "smaa_luts", "bevy_winit", "bevy_state", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "keyboard", "mouse", "png", "tonemapping_luts", "bevy_log", "bevy_mikktspace", "reflect_auto_register", "zstd_rust"] }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "collider-from-mesh", "enhanced-determinism"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
