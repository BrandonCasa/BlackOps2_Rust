[package]
name = "origins"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
default-run = "origins"
autobins = false
exclude = ["assets/**", "target/**"]

[[bin]]
name = "origins"
path = "src/main.rs"
required-features = ["game"]

[workspace]
members = ["."]
resolver = "3"

[patch.crates-io]
# Keep the game, Avian, and renderer on one Bevy source and one set of ECS types.
bevy = { path = "vendor/bevy" }
bevy_a11y = { path = "vendor/bevy/crates/bevy_a11y" }
bevy_android = { path = "vendor/bevy/crates/bevy_android" }
bevy_animation = { path = "vendor/bevy/crates/bevy_animation" }
bevy_anti_alias = { path = "vendor/bevy/crates/bevy_anti_alias" }
bevy_app = { path = "vendor/bevy/crates/bevy_app" }
bevy_asset = { path = "vendor/bevy/crates/bevy_asset" }
bevy_audio = { path = "vendor/bevy/crates/bevy_audio" }
bevy_camera = { path = "vendor/bevy/crates/bevy_camera" }
bevy_clipboard = { path = "vendor/bevy/crates/bevy_clipboard" }
bevy_color = { path = "vendor/bevy/crates/bevy_color" }
bevy_core_pipeline = { path = "vendor/bevy/crates/bevy_core_pipeline" }
bevy_curve = { path = "vendor/bevy/crates/bevy_curve" }
bevy_derive = { path = "vendor/bevy/crates/bevy_derive" }
bevy_dev_tools = { path = "vendor/bevy/crates/bevy_dev_tools" }
bevy_diagnostic = { path = "vendor/bevy/crates/bevy_diagnostic" }
bevy_ecs = { path = "vendor/bevy/crates/bevy_ecs" }
bevy_encase_derive = { path = "vendor/bevy/crates/bevy_encase_derive" }
bevy_extract = { path = "vendor/bevy/crates/bevy_extract" }
bevy_gizmos = { path = "vendor/bevy/crates/bevy_gizmos" }
bevy_gizmos_render = { path = "vendor/bevy/crates/bevy_gizmos_render" }
bevy_gltf = { path = "vendor/bevy/crates/bevy_gltf" }
bevy_image = { path = "vendor/bevy/crates/bevy_image" }
bevy_input = { path = "vendor/bevy/crates/bevy_input" }
bevy_input_focus = { path = "vendor/bevy/crates/bevy_input_focus" }
bevy_internal = { path = "vendor/bevy/crates/bevy_internal" }
bevy_light = { path = "vendor/bevy/crates/bevy_light" }
bevy_log = { path = "vendor/bevy/crates/bevy_log" }
bevy_macro_utils = { path = "vendor/bevy/crates/bevy_macro_utils" }
bevy_material = { path = "vendor/bevy/crates/bevy_material" }
bevy_math = { path = "vendor/bevy/crates/bevy_math" }
bevy_mesh = { path = "vendor/bevy/crates/bevy_mesh" }
bevy_pbr = { path = "vendor/bevy/crates/bevy_pbr" }
bevy_picking = { path = "vendor/bevy/crates/bevy_picking" }
bevy_platform = { path = "vendor/bevy/crates/bevy_platform" }
bevy_post_process = { path = "vendor/bevy/crates/bevy_post_process" }
bevy_ptr = { path = "vendor/bevy/crates/bevy_ptr" }
bevy_reflect = { path = "vendor/bevy/crates/bevy_reflect" }
bevy_remote = { path = "vendor/bevy/crates/bevy_remote" }
bevy_render = { path = "vendor/bevy/crates/bevy_render" }
bevy_scene = { path = "vendor/bevy/crates/bevy_scene" }
bevy_shader = { path = "vendor/bevy/crates/bevy_shader" }
bevy_shape = { path = "vendor/bevy/crates/bevy_shape" }
bevy_solari = { path = "vendor/bevy/crates/bevy_solari" }
bevy_sprite = { path = "vendor/bevy/crates/bevy_sprite" }
bevy_sprite_render = { path = "vendor/bevy/crates/bevy_sprite_render" }
bevy_state = { path = "vendor/bevy/crates/bevy_state" }
bevy_tasks = { path = "vendor/bevy/crates/bevy_tasks" }
bevy_text = { path = "vendor/bevy/crates/bevy_text" }
bevy_time = { path = "vendor/bevy/crates/bevy_time" }
bevy_transform = { path = "vendor/bevy/crates/bevy_transform" }
bevy_ui = { path = "vendor/bevy/crates/bevy_ui" }
bevy_ui_render = { path = "vendor/bevy/crates/bevy_ui_render" }
bevy_ui_widgets = { path = "vendor/bevy/crates/bevy_ui_widgets" }
bevy_utils = { path = "vendor/bevy/crates/bevy_utils" }
bevy_window = { path = "vendor/bevy/crates/bevy_window" }
bevy_winit = { path = "vendor/bevy/crates/bevy_winit" }
bevy_world_serialization = { path = "vendor/bevy/crates/bevy_world_serialization" }

[features]
default = ["game"]
game = ["dep:bevy", "dep:avian3d", "dep:bevy_input", "dep:rodio"]
dev-tools = ["bevy/bevy_remote", "dep:interprocess"]
profile-tracy = ["bevy/trace_tracy", "bevy/debug", "dep:tracy-client"]
profile-tracy-memory = ["profile-tracy", "bevy/trace_tracy_memory"]
profile-chrome = ["bevy/trace_chrome", "bevy/debug"]

[dependencies]
bevy = { optional = true, version = "=0.20.0", default-features = false, features = ["std", "debug", "async_executor", "multi_threaded", "bevy_asset", "bevy_scene", "bevy_gltf", "bevy_animation", "bevy_curve", "gltf_animation", "bevy_audio", "vorbis", "flac", "mp3", "wav", "png", "dds", "tga", "ktx2", "bevy_anti_alias", "dlss", "dlss_neural_rendering", "bevy_winit", "bevy_state", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "ui_picking", "bevy_text", "default_font", "keyboard", "mouse", "tonemapping_luts", "bevy_log", "bevy_mikktspace", "reflect_auto_register", "zstd_rust"] }
avian3d = { optional = true, git = "https://github.com/andriyDev/avian.git", rev = "34c9b008d2f40638a953d9218db48d54f661365d", default-features = false, features = ["3d", "parry-f32", "collider-from-mesh", "parallel", "enhanced-determinism", "xpbd_joints"] }
bevy_input = { optional = true, version = "=0.20.0", features = ["serialize"] }
rodio = { optional = true, version = "=0.22.2", default-features = false }
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
log = { version = "=0.4.34", features = ["max_level_debug", "release_max_level_info"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std", "release_max_level_info"] }
tracy-client = { version = "=0.19.0", default-features = false, features = ["only-localhost"], optional = true }


[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.5", default-features = false, optional = true }

[profile.dev]
opt-level = 1
lto = "off"
codegen-units = 256
incremental = true
debug = "line-tables-only"
debug-assertions = true

[profile.staging]
inherits = "dev"
opt-level = 3
lto = true
codegen-units = 64

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
debug = false
debug-assertions = false
panic = "abort"
strip = "symbols"
