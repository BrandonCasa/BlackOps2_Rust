[package]
name = "bo2-geometry-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Finite offscreen Bevy diagnostic of unchanged raw snapshot geometry"

[dependencies]
bo2-assets = { path = "../../../crates/assets" }
bo2-rendering = { path = "../../../crates/rendering" }
bevy = { workspace = true, features = ["bevy_pbr"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
