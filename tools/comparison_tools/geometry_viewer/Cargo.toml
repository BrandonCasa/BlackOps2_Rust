[package]
name = "bo2-geometry-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Offscreen and interactive Bevy diagnostics of unchanged raw snapshot geometry"

[dependencies]
bo2-assets = { path = "../../../crates/assets" }
bo2-rendering = { path = "../../../crates/rendering", features = ["client"] }
bevy = { workspace = true, features = ["bevy_pbr", "bevy_winit", "keyboard", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
sha2 = "=0.10.9"
