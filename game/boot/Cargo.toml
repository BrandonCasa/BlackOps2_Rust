[package]
name = "bo2-boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Headless Bevy lifecycle smoke executable for the Origins reimplementation"

[features]
default = []
client = ["bevy/bevy_pbr", "bevy/bevy_winit", "bevy/keyboard", "bevy/x11", "bo2-rendering/client"]

[dependencies]
bo2-core = { path = "../../crates/core" }
bo2-rendering = { path = "../../crates/rendering", optional = true }
bevy.workspace = true
